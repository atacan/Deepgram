openapi: 3.0.0
info:
  title: Deepgram Speech Recognition API
  description: API for Deepgram's speech recognition service.
  version: "1.0"
servers:
  - url: https://api.deepgram.com/v1
paths:
  /listen:
    post:
      summary: Transcribe audio file
      description: This endpoint transcribes given audio file to text.
      operationId: transcribeLocalAudio
      parameters:
        - name: smart_format
          in: query
          description: Enable smart formatting
          required: true
          schema:
            type: boolean
        - name: model
          in: query
          description: The model used for transcription
          required: true
          schema:
            type: string
        - name: language
          in: query
          description: Language of the audio
          required: true
          schema:
            type: string
      requestBody:
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful transcription of the audio file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
      security:
        - ApiKeyAuth: []

components:
  schemas:
    TranscriptionResponse:
      type: object
      properties:
        metadata:
          type: object
          properties:
            transaction_key:
              type: string
              example: "deprecated"
            request_id:
              type: string
              example: "00af010e-8574-4fb0-895b-d7251dbc7464"
            sha256:
              type: string
              example: "532...566"
            created:
              type: string
              format: date-time
              example: "2021-09-27T20:48:17.706Z"
            duration:
              type: number
              format: float
              example: 17.56631
            channels:
              type: integer
              example: 1
            models:
              type: array
              items:
                type: string
              example: ["41757536-6114-494d-83fd-c2694524d80b"]
        results:
          $ref: '#/components/schemas/Results'
        
    Results:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        
    Channel:
      type: object
      properties:
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/Alternative'
          
    Alternative:
      type: object
      properties:
        transcript:
          type: string
        confidence:
          type: number
          format: float
        words:
          type: array
          items:
            $ref: '#/components/schemas/Word'
        paragraphs:
          $ref: '#/components/schemas/Paragraphs'
          
    Word:
      type: object
      properties:
        word:
          type: string
        start:
          type: number
          format: float
        end:
          type: number
          format: float
        confidence:
          type: number
          format: float
        punctuated_word:
          type: string
    
    Paragraphs:
      type: object
      properties:
        transcript:
          type: string
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/SingleParagraph'
    
    SingleParagraph:
      type: object
      properties:
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/Sentence'
        num_words:
          type: integer
        start:
          type: number
          format: float
        end:
          type: number
          format: float
        
    Sentence:
      type: object
      properties:
        text:
          type: string
        start:
          type: number
          format: float
        end:
          type: number
          format: float
          
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
